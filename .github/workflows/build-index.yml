# K0-0914-AR-A · relay index.json 자동 생성 · push 트리거 (main branch).
# K1-0914-A · checks/** 트리거 추가 · k1/** 편입 · schema_version 2 정본.
#
# 뿌리 (Kyu 원문 09-14): 포털 프로덕션 = GitHub API 디렉터리 listing 의존 = 토큰 부재 시
# fail · 비인증 60/h rate limit. 정본 = 이 Action 이 main push 마다 index.json 생성 · 커밋 ·
# 포털은 raw.githubusercontent 에서 1회 fetch (무제한 · 무인증).
#
# 부수 목적 (Kyu 원문 B2): index 갱신 시 포털 /api/push/notify webhook 호출 → Web Push 발송.

name: build-index

on:
  push:
    branches: [main]
    paths:
      - 'prompts/**'
      - 'k0/**'
      - 'k1/**'
      - 'k2/**'
      - 'n0/**'
      - 't0/**'
      - 'm0/**'
      - 'checks/**'
      - 'events/**'
      - 'ledger/**'
      - 'scripts/build-index.mjs'
      - '.github/workflows/build-index.yml'
  schedule:
    # K1-0916-B/C · A5 · 월요일 09:00 WIB (UTC+7) = 02:00 UTC · 밀림 푸시
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      backlog_notify:
        description: '월요일 밀림 푸시 강제 실행 (미발부/최장/🔴)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build index.json
        # K1-0917-B · collectFeatureMaps 는 각 리포 main docs/feature-map.yaml fetch · GITHUB_TOKEN 필요 (Rate 5000/h · private repo access).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-index.mjs

      - name: Commit index.json (auto)
        run: |
          if [ -n "$(git status --porcelain index.json)" ]; then
            git config user.name "curiocity-relay-index"
            git config user.email "curiocity.dev.ai+relay-index@gmail.com"
            git add index.json
            git commit -m "chore(index): auto-rebuild (K1-0914-A schema v2)"
            git push
          else
            echo "index.json unchanged · skip commit"
          fi

      - name: Notify portal (Web Push webhook · K0-0914-AR-B2 · K1-0916-A CF Access)
        if: env.PORTAL_PUSH_WEBHOOK != '' && github.event_name == 'push'
        env:
          PORTAL_PUSH_WEBHOOK: ${{ secrets.PORTAL_PUSH_WEBHOOK }}
          PORTAL_PUSH_TOKEN: ${{ secrets.PORTAL_PUSH_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # K1-0916-A · CF Access Service Token 헤더 편입 (notify endpoint 는 Access 뒤 · Bearer 만으로는 302)
          CF_ARGS=""
          if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
            CF_ARGS="-H CF-Access-Client-Id:${CF_ACCESS_CLIENT_ID} -H CF-Access-Client-Secret:${CF_ACCESS_CLIENT_SECRET}"
          fi
          curl -sS -X POST "$PORTAL_PUSH_WEBHOOK" $CF_ARGS \
            -H "content-type: application/json" \
            -H "authorization: Bearer $PORTAL_PUSH_TOKEN" \
            -d '{"event":"index.rebuilt","source":"curiocity-relay","commit":"'"${GITHUB_SHA}"'"}' \
            || echo "webhook failed · non-blocking"

      # K1-0916-B/C · A5 · 월요일 09:00 WIB 밀림 푸시 (cron 또는 수동 dispatch)
      - name: Backlog push (월요일 09:00 WIB · schedule 또는 강제 dispatch)
        if: env.PORTAL_PUSH_WEBHOOK != '' && (github.event_name == 'schedule' || inputs.backlog_notify == true)
        env:
          PORTAL_PUSH_WEBHOOK: ${{ secrets.PORTAL_PUSH_WEBHOOK }}
          PORTAL_PUSH_TOKEN: ${{ secrets.PORTAL_PUSH_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          # index.json.rollup 파싱 · "미발부 N · 최장 N일 · 🔴 N" 메시지 조립
          FILED=$(jq -r '.rollup.filed_count // 0' index.json)
          MAX_AGE=$(jq -r '.rollup.max_age_days // 0' index.json)
          RED=$(jq -r '.rollup.red_count // 0' index.json)
          MSG="미발부 ${FILED} · 최장 ${MAX_AGE}일 · 🔴 ${RED}"
          echo "backlog push · $MSG"
          CF_ARGS=""
          if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
            CF_ARGS="-H CF-Access-Client-Id:${CF_ACCESS_CLIENT_ID} -H CF-Access-Client-Secret:${CF_ACCESS_CLIENT_SECRET}"
          fi
          # K1-0916-B/C · Kyu 원문 정본 문구
          PAYLOAD=$(jq -n --arg title "요구 밀림" --arg body "$MSG" --arg url "https://test.curiocity.company/" '{event:"backlog.weekly",title:$title,body:$body,url:$url}')
          curl -sS -X POST "$PORTAL_PUSH_WEBHOOK" $CF_ARGS \
            -H "content-type: application/json" \
            -H "authorization: Bearer $PORTAL_PUSH_TOKEN" \
            -d "$PAYLOAD" \
            || echo "backlog webhook failed · non-blocking"
