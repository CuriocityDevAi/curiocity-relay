<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ci-watch</title>
<style>
/* ── CSS 변수 ── */
:root {
  /* Surfaces */
  --bg:       #0d1117;
  --surface:  #161b22;
  --surface-2:#21262d;
  --border:   #30363d;

  /* Text */
  --fg:       #e6edf3;
  --dim:      #768390;
  --bold:     #cdd9e5;

  /* Status */
  --ok:       #3fb950;
  --accent:   #58a6ff;
  --warn:     #d29922;
  --bad:      #f85149;

  /* Data colors (원색 허용 · 코딩/리뷰/진단/실패) */
  --color-coding:  #58a6ff;
  --color-review:  #bc8cff;
  --color-diag:    #ffa657;
  --color-fail:    #f85149;
  --color-idle:    #30363d;
}

/* ── reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  font-size: 13px;
  line-height: 1.5;
  min-height: 100dvh;
}
a { color: var(--accent); text-decoration: none; }
button { font: inherit; cursor: pointer; border: none; background: none; }

/* ── header ── */
.cw-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
  padding: 8px 14px;
  border-bottom: 2px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 10;
}
.cw-head-delayed { border-bottom-color: var(--warn); }
.cw-title { font-weight: bold; color: var(--bold); }
.cw-ver   { color: var(--dim); font-size: 11px; }
.cw-time  { color: var(--dim); font-size: 11px; }
.cw-spin  { display: inline-block; color: var(--dim); animation: spin 1s linear infinite; }
.cw-age   { color: var(--dim); font-size: 11px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── badges / pills ── */
.cw-badge {
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  user-select: none;
  white-space: nowrap;
}
.cw-badge-prog { background: #1f6feb22; color: var(--accent); border: 1px solid #1f6feb55; }
.cw-badge-bad  { background: #f8514922; color: var(--bad);    border: 1px solid #f8514955; }
.cw-badge-ok   { background: #3fb95022; color: var(--ok);     border: 1px solid #3fb95055; }
.cw-badge-warn { background: #d2992222; color: var(--warn);   border: 1px solid #d2992255; }
.cw-badge-dim  { background: var(--surface-2); color: var(--dim); border: 1px solid var(--border); }

/* ── alerts panel ── */
.cw-alerts-panel {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 8px 14px;
}
.cw-alert-row { color: var(--bad); padding: 2px 0; font-size: 12px; }

/* ── hub cards (desktop 5칸) ── */
.cw-hub-cards {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.cw-hub-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  min-height: 90px;
  transition: border-color 0.2s;
}
.cw-hub-card-active {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px #1f6feb44;
}
.cw-hub-card-top {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}
.cw-hub-name    { font-weight: bold; color: var(--bold); }
.cw-hub-model   { font-size: 10px; color: var(--dim); background: var(--surface-2); padding: 1px 4px; border-radius: 3px; }
.cw-hub-spinner { color: var(--accent); animation: spin 1s linear infinite; }
.cw-hub-id      { color: var(--accent); font-size: 11px; margin-bottom: 2px; }
.cw-hub-title   { color: var(--fg); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 4px; }
.cw-hub-idle    { color: var(--dim); }
.cw-hub-last    { color: var(--dim); font-size: 10px; }
.cw-hub-bar-wrap {
  height: 4px;
  background: var(--surface-2);
  border-radius: 2px;
  margin-bottom: 2px;
  overflow: hidden;
}
.cw-hub-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.5s;
}
.cw-hub-bar-over { background: var(--warn); }
.cw-hub-progress { font-size: 10px; color: var(--dim); }
.cw-hub-over     { color: var(--warn); }

/* ── 9-stage board ── */
.cw-board-wrap { overflow-x: auto; border-bottom: 1px solid var(--border); }
.cw-board {
  display: grid;
  grid-template-columns: repeat(9, minmax(110px, 1fr));
  gap: 0;
  padding: 10px 14px;
  min-width: 990px;
}
.cw-board-col {
  border-right: 1px solid var(--border);
  padding: 0 8px;
  min-height: 60px;
}
.cw-board-col:last-child { border-right: none; }
.cw-board-col-head {
  font-size: 11px;
  color: var(--dim);
  font-weight: bold;
  margin-bottom: 6px;
  text-align: center;
  padding-bottom: 4px;
  border-bottom: 1px solid var(--border);
}
.cw-board-empty { color: var(--dim); font-size: 11px; text-align: center; padding: 4px 0; }
.cw-board-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 5px 6px;
  margin-bottom: 4px;
  font-size: 11px;
  transition: border-color 0.2s;
}
.cw-board-card:hover { background: var(--surface-2); }
.cw-board-card-green  { border-color: var(--border); }
.cw-board-card-yellow { border-color: var(--warn); }
.cw-board-card-red    { border-color: var(--bad); }
.cw-board-card-id     { color: var(--accent); font-weight: bold; }
.cw-board-card-title  { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100px; }
.cw-board-card-age    { color: var(--dim); }

/* ── sections (timeline, CI) ── */
.cw-section { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.cw-section-head { font-size: 12px; color: var(--dim); font-weight: bold; margin-bottom: 8px; }

/* ── today timeline ── */
.cw-tl-grid { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
.cw-tl-row  { display: flex; align-items: center; gap: 8px; height: 20px; }
.cw-tl-hub  { color: var(--bold); font-weight: bold; min-width: 2.5em; font-size: 11px; }
.cw-tl-bar  { flex: 1; height: 14px; background: var(--surface-2); border-radius: 3px; position: relative; overflow: hidden; }
.cw-tl-seg  { position: absolute; top: 0; height: 100%; border-radius: 2px; }
.cw-tl-seg-coding { background: var(--color-coding); }
.cw-tl-seg-review { background: var(--color-review); }
.cw-tl-seg-diag   { background: var(--color-diag); }
.cw-tl-seg-fail   { background: var(--color-fail); }
.cw-tl-legend     { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cw-tl-legend-chip { width: 16px; height: 10px; display: inline-block; border-radius: 2px; vertical-align: middle; }

/* ── CI machines ── */
.cw-ci-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.cw-ci-col { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
.cw-ci-col-head { font-weight: bold; color: var(--bold); font-size: 12px; margin-bottom: 6px; }
.cw-ci-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 6px; }
.cw-ci-slot {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 3px 5px;
  font-size: 10px;
  color: var(--dim);
  min-height: 32px;
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.cw-ci-slot-busy { border-color: var(--accent); background: #1f6feb11; }
.cw-ci-slot-name { color: var(--accent); font-weight: bold; }
.cw-ci-job  { color: var(--accent); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cw-ci-today  { font-size: 11px; color: var(--dim); margin-bottom: 2px; }
.cw-ci-tokens { font-size: 10px; color: var(--dim); }

/* ── phone hub mini ── */
.cw-hub-mini {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
}
.cw-hub-mini-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 6px 4px;
  text-align: center;
  cursor: pointer;
  min-height: 60px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.cw-hub-mini-item:active { background: var(--surface-2); }
.cw-hub-mini-active { border-color: var(--accent); }
.cw-hub-mini-name  { font-weight: bold; color: var(--bold); font-size: 11px; }
.cw-hub-mini-spin  { color: var(--accent); animation: spin 1s linear infinite; font-size: 10px; }
.cw-hub-mini-stage { font-size: 10px; color: var(--dim); }
.cw-hub-mini-bar   { width: 100%; height: 3px; background: var(--surface-2); border-radius: 1px; overflow: hidden; }
.cw-hub-mini-fill  { height: 100%; background: var(--accent); }

/* ── phone board mini ── */
.cw-board-mini {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 2px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  overflow-x: auto;
}
.cw-board-mini-cell {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 3px 2px;
  text-align: center;
  min-width: 32px;
}
.cw-board-mini-active { border-color: var(--accent); }
.cw-board-mini-stage { font-size: 9px; color: var(--dim); }
.cw-board-mini-cnt   { font-size: 11px; color: var(--bold); font-weight: bold; }

/* ── phone timeline mini ── */
.cw-tl-mini {
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.cw-tl-mini-row {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 10px;
}
.cw-tl-mini-hub  { font-size: 9px; color: var(--dim); min-width: 2em; }
.cw-tl-mini-bar  { flex: 1; height: 8px; background: var(--surface-2); border-radius: 2px; position: relative; overflow: hidden; }
.cw-tl-mini-seg  { position: absolute; top: 0; height: 100%; border-radius: 1px; }
.cw-tl-mini-seg-active { background: var(--accent); }
.cw-tl-mini-seg-done   { background: var(--ok); }

/* ── phone CI mini ── */
.cw-ci-mini {
  display: flex;
  gap: 8px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.cw-ci-mini-col { flex: 1; }
.cw-ci-mini-label { font-size: 10px; color: var(--dim); font-weight: bold; margin-bottom: 3px; }
.cw-ci-mini-chips { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; margin-bottom: 3px; }
.cw-ci-chip      { height: 10px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--border); }
.cw-ci-chip-busy { background: var(--accent); border-color: var(--accent); }
.cw-ci-mini-cnt  { font-size: 10px; color: var(--dim); }

/* ── detail panels ── */
.cw-detail-panel {
  min-height: calc(100dvh - 50px);
  background: var(--bg);
  padding: 10px 14px;
}
.cw-back-btn {
  display: flex;
  align-items: center;
  min-height: 44px;
  min-width: 44px;
  color: var(--accent);
  font-size: 14px;
  padding: 0;
  margin-bottom: 10px;
}
.cw-detail-section { }
.cw-detail-head    { font-size: 14px; color: var(--bold); margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.cw-detail-subhead { font-size: 12px; color: var(--dim); margin: 8px 0 4px; }
.cw-detail-id      { color: var(--accent); font-weight: bold; font-size: 13px; margin-bottom: 2px; }
.cw-detail-title   { color: var(--fg); margin-bottom: 4px; }
.cw-detail-time    { color: var(--dim); font-size: 11px; margin-bottom: 4px; }
.cw-detail-link    { color: var(--accent); font-size: 12px; margin-bottom: 6px; display: inline-block; }
.cw-detail-item    { padding: 4px 0; border-bottom: 1px solid var(--surface-2); font-size: 12px; }
.cw-detail-item-tappable { cursor: pointer; }
.cw-detail-item-tappable:active { background: var(--surface); }

/* ── stage strip ── */
.cw-stage-strip { font-size: 10px; margin: 4px 0; display: flex; flex-wrap: wrap; gap: 2px 4px; }
.cw-stage-dot.done { color: var(--ok); }
.cw-stage-dot.cur  { color: var(--accent); }
.cw-stage-dot.todo { color: var(--dim); }

/* ── utilities ── */
.cw-dim { color: var(--dim); }

/* ── desktop only ── */
@media (min-width: 900px) {
  .cw-hub-mini, .cw-board-mini, .cw-tl-mini, .cw-ci-mini { display: none !important; }
}

/* ── mobile only ── */
@media (max-width: 899px) {
  .cw-hub-cards, .cw-board-wrap, .cw-section { display: none !important; }
  body { font-size: 12px; }
}

/* Touch targets on mobile */
@media (max-width: 899px) {
  .cw-hub-mini-item { min-height: 44px; }
  .cw-board-mini-cell { min-height: 44px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="loading" style="color:var(--dim);padding:20px 14px;font-style:italic;">데이터 로딩 중…</div>
</div>
<script src="/ui.js"></script>
</body>
</html>
